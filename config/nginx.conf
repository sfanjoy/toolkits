#
# nginx.conf for Local Notion... website
#
user  nginx;
worker_processes  1;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

# Sites
#
  include /etc/nginx/sites-enabled/*;
}
